# Nginx — Site Raízes (catálogo público)
# Instalação: /etc/nginx/sites-available/raizes-site  (+ link em sites-enabled)
# HTTPS:      sudo certbot --nginx -d catalogo.gestaoraizes.com.br
#
# Repassa para o processo raizes-site (127.0.0.1:5100). O site não tem login e não
# acessa o banco da gestão. Na troca para o domínio comercial: novo server_name com
# certificado, e este endereço responde com 301 para o novo (veja o fim do arquivo).

server {
    listen 80;
    listen [::]:80;
    server_name catalogo.gestaoraizes.com.br;

    client_max_body_size 1m;

    # Só a gestão, de dentro do servidor, avisa o site; nunca por aqui
    location ^~ /api/interno/ {
        return 404;
    }

    location / {
        proxy_pass         http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# Depois da troca de domínio, substitua o bloco acima por:
# server {
#     listen 80;
#     server_name catalogo.gestaoraizes.com.br;
#     return 301 https://<domínio-comercial>$request_uri;
# }
