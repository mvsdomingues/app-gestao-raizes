# Nginx — Raízes · Catálogo & Orçamento
# Instalação: /etc/nginx/sites-available/raizes  (+ link em sites-enabled)
#
# Repassa tudo para a aplicação Node em 127.0.0.1:5000. A aplicação tem login
# próprio; só ficam abertas, sem login, a página do cliente (/o/<código>) e a
# API dela (/api/publico/), protegidas pelo código aleatório do link.
# Por isso NÃO use auth_basic aqui: o cliente não conseguiria abrir o link.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Troque "_" pelo seu domínio quando tiver um (ex.: orcamentos.raizespersonalizados.com.br)
    # e gere o certificado HTTPS com: sudo certbot --nginx -d <domínio>
    server_name _;

    # Orçamentos com fotos de produtos avulsos podem ser grandes
    client_max_body_size 50m;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
