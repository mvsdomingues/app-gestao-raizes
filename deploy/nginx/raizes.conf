# Nginx — Raízes · Catálogo & Orçamento
# Instalação: /etc/nginx/sites-available/raizes  (+ link em sites-enabled)
#
# Repassa tudo para a aplicação Node em 127.0.0.1:5000 e exige usuário/senha,
# porque a aplicação não tem login próprio.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Troque "_" pelo seu domínio quando tiver um (ex.: orcamento.raizes.com.br)
    server_name _;

    # Orçamentos com fotos de produtos avulsos podem ser grandes
    client_max_body_size 50m;

    # Usuário e senha (arquivo criado com o comando htpasswd)
    auth_basic           "Raizes - acesso restrito";
    auth_basic_user_file /etc/nginx/.htpasswd-raizes;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
